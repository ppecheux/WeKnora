# Default values for weknora.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
      - NET_ADMIN
      - NET_RAW
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
front:
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 8080

  image:
    repository: ""
    tag: ""

  livenessProbe:
    tcpSocket:
      port: http
  readinessProbe:
    tcpSocket:
      port: http
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi
knora:
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 8080

  image:
    repository: ""
    tag: ""

  # livenessProbe:
  #   httpGet:
  #     port: http
  # readinessProbe:
  #   httpGet:
  #     port: http
  #     path: /health
  readinessProbe:
    tcpSocket:
      port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi

  env:
    GIN_MODE: ""
    DB_DRIVER: ""
    DB_HOST: ""
    DB_PORT: ""
    DB_USER: ""
    DB_PASSWORD: ""
    DB_NAME: ""
    TZ: ia/Shanghai
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_SERVICE_NAME: ""
    OTEL_TRACES_EXPORTER: ""
    OTEL_METRICS_EXPORTER: ""
    OTEL_LOGS_EXPORTER: ""
    OTEL_PROPAGATORS: ""
    RETRIEVE_DRIVER: ""
    ELASTICSEARCH_ADDR: ""
    ELASTICSEARCH_USERNAME: ""
    ELASTICSEARCH_PASSWORD: ""
    ELASTICSEARCH_INDEX: ""
    DOCREADER_ADDR: ""
    STORAGE_TYPE: ""
    LOCAL_STORAGE_BASE_DIR: ""
    MINIO_ENDPOINT: ""
    MINIO_ACCESS_KEY_ID: ""
    MINIO_SECRET_ACCESS_KEY: ""
    MINIO_BUCKET_NAME: ""
    OLLAMA_BASE_URL: ""
    STREAM_MANAGER_TYPE: ""
    REDIS_ADDR: ""
    REDIS_PASSWORD: ""
    REDIS_DB: ""
    REDIS_PREFIX: ""
    ENABLE_GRAPH_RAG: ""
    TENANT_AES_KEY: ""
    INIT_LLM_MODEL_NAME: ""
    INIT_LLM_MODEL_BASE_URL: ""
    INIT_LLM_MODEL_API_KEY: ""
    INIT_EMBEDDING_MODEL_NAME: ""
    INIT_EMBEDDING_MODEL_BASE_URL: ""
    INIT_EMBEDDING_MODEL_API_KEY: ""
    INIT_EMBEDDING_MODEL_DIMENSION: ""
    INIT_EMBEDDING_MODEL_ID: ""
    INIT_RERANK_MODEL_NAME: ""
    INIT_RERANK_MODEL_BASE_URL: ""
    INIT_RERANK_MODEL_API_KEY: ""
    INIT_TEST_TENANT_ID: ""
    INIT_TEST_KNOWLEDGE_BASE_ID: ""

reader:
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 50051

  image:
    repository: ""
    tag: ""
  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    tcpSocket:
      port: http
  readinessProbe:
    httpGet:
      port: http
      path: /

  env: {}
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi

image:
  pullPolicy: IfNotPresent

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

nodeSelector: {}

tolerations: []

affinity: {}

postgresql:
  enabled: true
  auth:
    username: &pgUser weknora
    password: weknora
    database: weknora
  shmVolume:
    sizeLimit: 256Mi
  primary:
    initdb:
      scriptsConfigMap: "postgresql-initdb-scripts"
    resourcesPreset: "nano"

    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    extraVolumeMounts:
      - name: empty-dir
        mountPath: /var/run
        subPath: var/run
        readonly: false
    extraEnvVars:
      - name: POSTGRES_DB
        value: weknora

  image:
    repository: paradedb/paradedb
    tag: "0.17.3"
    digest: sha256:2dd523560e317024723962479e93367a67eefa263a0fc391be2489dba1016989
  global:
    security:
      allowInsecureImages: true
redis:
  enabled: true
  image:
    repository: bitnami/redis
    tag: 8.2.0-debian-12-r0
    digest: sha256:942271e7b024af7464a6de564d453a35bf4e674afe81333e6fe6c5141b100e84
  master:
    service:
      ports:
        redis: 6379
  architecture: "standalone"
  command:
    - /bin/sh
  auth:
    password: "your-redis-password"
jaeger:
  enabled: true
  service:
    ## @param collector.service.type Jaeger service type
    ##
    type: ClusterIP
    ## Jaeger collector ports to expose
    ## ref: https://www.jaegertracing.io/docs/latest/architecture/apis/
    ports:
      ## Otlp ports to expose
      ##
      otlp:
        ## @param collector.service.ports.otlp.grpc Accepts traces in OpenTelemetry OTLP format over gRPC
        ##
        grpc: 4317
        ## @param collector.service.ports.otlp.http Accepts traces in OpenTelemetry OTLP format over HTTP
        ##
        http: 4318
      ## Legacy Jaeger Write API. Maintained for backward-compatibility
      ##
      jaeger:
        ## @param collector.service.ports.jaeger.grpc Legacy Jaeger protobuf via gRPC API port
        ##
        grpc: 14250
        ## @param collector.service.ports.jaeger.thrift_http Legacy Jaeger Thrift over HTTP API port
        ##
        thrift_http: 14268
      ## @param collector.service.ports.zipkin can accept Zipkin spans in Thrift, JSON and Proto (disabled by default)
      ##
      zipkin: 9411
      ## @param collector.service.ports.metrics Jaeger collector prometheus metrics port
      ##
      metrics: 8888
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi
  externalDatabase:
    host: "wkr-cassandra"
    existingSecret: "wkr-cassandra"
    existingSecretPasswordKey: "cassandra-password"
    dbUser:
      user: "cassandra"
      password: "cassandra"
  cassandra:
    enabled: false
    # resourcesPreset: "small"
cassandra:
  enabled: true
  dbUser:
    user: cassandra
    forcePassword: false
    password: "cassandra"
