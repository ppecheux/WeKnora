apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "weknora.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.labels" . | nindent 4 }}
    app.kubernetes.io/component: front
    is-test: "true"
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.37@sha256:ab33eacc8251e3807b85bb6dba570e4698c3998eca6f0fc2ccb60575a563ea74
      command: ['wget']
      args: ['{{ include "weknora.fullname" . }}-front:{{ .Values.front.service.port }}']
  restartPolicy: Never
