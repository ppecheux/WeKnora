apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "weknora.fullname" . }}-test-connection"
  labels:
    {{- include "weknora.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "weknora.fullname" . }}-front:{{ .Values.front.service.port }}']
  restartPolicy: Never
