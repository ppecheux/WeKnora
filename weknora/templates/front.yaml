apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weknora.fullname" . }}-front
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.labels" . | nindent 4 }}
    app.kubernetes.io/component: front
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "weknora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: front
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "weknora.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: front
        service: front
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "weknora.serviceAccountName" . }}
      initContainers:
        - name: copy-config
          image: busybox:latest
          command:
            - sh
            - -c
            - |              
              cp /etc/nginx-config-readonly/default.conf /etc/nginx/conf.d/default.conf
              chown 1000:1000 /etc/nginx/conf.d/default.conf
          volumeMounts:
          - name: nginx-config-from-cm
            mountPath: /etc/nginx-config-readonly
            readOnly: true
          - name: empty-dir
            mountPath: /etc/nginx/conf.d
            subPath: etc/nginx/conf.d
            readOnly: false
          securityContext:
            runAsUser: 0
        - name: wait-for-knora
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: nicolaka/netshoot:v0.14@sha256:7f08c4aff13ff61a35d30e30c5c1ea8396eac6ab4ce19fd02d5a4b3b5d0d09a2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", 'while true; do nc -zv {{ .Release.Name }}-knora {{ .Values.knora.service.port }} && break || sleep 1; done']

      containers:
        - name: front
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.front.image.repository }}:{{ .Values.front.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.front.service.port }}
              protocol: TCP
          {{- with .Values.front.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.front.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.front.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          - name: nginx-config-from-cm
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: false
          - name: empty-dir
            mountPath: /var/nginx-writable/temp
            subPath: var/nginx-writable/temp
            readOnly: false
          - name: empty-dir
            mountPath: /tmp
            subPath: tmp
            readOnly: false
          - name: empty-dir
            mountPath: /etc/nginx/conf.d
            subPath: etc/nginx/conf.d
            readOnly: false
      volumes:
        - name: nginx-config-from-cm
          configMap:
            name: {{ include "weknora.fullname" . }}-front-nginx-config
        - name: empty-dir
          emptyDir:
            sizeLimit: 1Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
