apiVersion: v1
kind: Service
metadata:
  name: {{ include "weknora.fullname" . }}-knora
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.labels" . | nindent 4 }}
    app.kubernetes.io/component: knora
spec:
  type: {{ .Values.knora.service.type }}
  ports:
    - port: {{ .Values.knora.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "weknora.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: knora
